# Production Logging Configuration for pub-analysis-agent
# This configuration is optimized for production deployment with
# structured JSON logging and proper log management

logging:
  # Global log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Log format - use JSON for production for better parsing
  json_format: true
  
  # Console logging (usually disabled in production)
  console_enabled: false
  console_level: "WARNING"
  
  # File logging configuration
  file_enabled: true
  file_level: "INFO"
  
  # Log directory and file names
  log_directory: "/var/log/pub-analysis-agent"
  main_log_file: "pub-analysis-agent.log"
  error_log_file: "pub-analysis-agent-errors.log"
  
  # Log rotation settings
  max_file_size: 104857600  # 100MB
  backup_count: 10          # Keep 10 rotated files
  
  # Component-specific log levels
  component_levels:
    # Core system components
    "pub_analysis_agent": "INFO"
    "workflow": "INFO"
    "agents": "INFO"
    "services": "INFO"
    
    # LLM interactions - more verbose for debugging
    "llm": "INFO"
    "agents.dataset_detector": "INFO"
    "agents.data_analyzer": "INFO"
    "agents.hypothesis_extractor": "INFO"
    "agents.methodology_extractor": "INFO"
    
    # Database operations
    "database": "INFO"
    "services.mongodb": "INFO"
    "services.elasticsearch": "INFO"
    
    # External libraries - less verbose
    "httpx": "WARNING"
    "urllib3": "WARNING"
    "pymongo": "WARNING"
    "elasticsearch": "WARNING"
    "transformers": "ERROR"
    "torch": "ERROR"
    
    # LangGraph framework
    "langgraph": "INFO"
    "langchain": "WARNING"

# Environment settings
environment: "production"

# Database configuration for production
database:
  connection_string: "${MONGODB_CONNECTION_STRING}"
  database: "dimensions"
  datasets_collection: "general.datasets"
  results_collection: "dimensions.llm_analyses"
  max_pool_size: 100
  min_pool_size: 10
  connect_timeout_ms: 10000
  server_selection_timeout_ms: 10000
  ssl_enabled: true

# Elasticsearch configuration for production
elasticsearch:
  url: "${ELASTICSEARCH_URL}"
  index: "publications"
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl_verify: true
  timeout: 30
  max_retries: 3
  
# LLM service configuration for production
llm:
  local_endpoints:
    ollama: "${OLLAMA_ENDPOINT:-http://localhost:11434/api}"
    lmstudio: "${LMSTUDIO_ENDPOINT:-http://localhost:1234/v1}"
  
  api_keys:
    openai: "${OPENAI_API_KEY}"
    anthropic: "${ANTHROPIC_API_KEY}"
  
  default_model: "ollama/llama3.1:8b"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120
  max_retries: 3
  retry_delay: 2.0

# Processing configuration for production
processing:
  batch_size: 100
  max_concurrent_requests: 20
  request_timeout: 300
  max_memory_usage_mb: 8192
  enable_gpu: true
  
  # LangGraph workflow settings
  workflow_max_steps: 50
  workflow_timeout: 1800  # 30 minutes
  
  # Confidence thresholds
  dataset_detection_threshold: 0.7
  analysis_confidence_threshold: 0.8

# Security settings for production
security:
  rate_limiting:
    requests_per_minute: 1000
    burst_limit: 100
  
  api_key_required: true
  ssl_required: true

# Development settings (disabled in production)
development:
  debug_enabled: false
  profiling_enabled: false
  test_database_enabled: false 